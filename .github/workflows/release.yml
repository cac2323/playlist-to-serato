name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Import certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$CERTIFICATE_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build app bundle
        run: python3 -m PyInstaller playlist_to_serato.spec --noconfirm

      - name: Sign app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SKIP_PYINSTALLER=1 SKIP_NOTARIZE=1 bash build.sh

      - name: Check notarize secrets
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          echo "APPLE_ID length=${#APPLE_ID}"
          echo "TEAM_ID length=${#TEAM_ID}"
          echo "APP_PASSWORD length=${#APP_PASSWORD}"
          test -n "$APPLE_ID"
          test -n "$TEAM_ID"
          test -n "$APP_PASSWORD"

      - name: Restore login keychain for notarytool
        run: |
          LOGIN="$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$LOGIN" || true
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$LOGIN" ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN"
          fi

      - name: Zip for notarization
        run: |
          rm -f dist/Playlist.to.Serato.zip
          ditto -c -k --keepParent "dist/Playlist to Serato.app" dist/Playlist.to.Serato.zip
          ls -lh dist/Playlist.to.Serato.zip

      - name: Submit to Apple notary
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          APPLE_ID="${APPLE_ID//$'\r'/}"
          APPLE_ID="${APPLE_ID//$'\n'/}"
          APP_PASSWORD="${APP_PASSWORD//$'\r'/}"
          APP_PASSWORD="${APP_PASSWORD//$'\n'/}"
          TEAM_ID="${TEAM_ID//$'\r'/}"
          TEAM_ID="${TEAM_ID//$'\n'/}"
          set +e
          OUT=$(xcrun notarytool submit dist/Playlist.to.Serato.zip \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1)
          STATUS=$?
          set -e
          SAFE="$OUT"
          SAFE="${SAFE//$APPLE_ID/[APPLE_ID]}"
          SAFE="${SAFE//$APP_PASSWORD/[APP_PASSWORD]}"
          SAFE="${SAFE//$TEAM_ID/[TEAM_ID]}"
          echo "$SAFE"
          B64=$(printf '%s' "$SAFE" | base64 | tr -d '\n')
          echo "notarytool_b64=$B64"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::notarytool exit $STATUS b64=$B64"
            exit 1
          fi

      - name: Staple and re-zip
        run: |
          xcrun stapler staple "dist/Playlist to Serato.app"
          rm -f dist/Playlist.to.Serato.zip
          ditto -c -k --keepParent "dist/Playlist to Serato.app" dist/Playlist.to.Serato.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Playlist.to.Serato.zip

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
