<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist → Serato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <h1>playlist → serato</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-refresh" title="Refresh playlists">↺</button>
        <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
      </div>
    </div>

    <!-- Source toggle (Spotify hidden until BYO Client ID ships) -->
    <div class="source-toggle" hidden>
      <button class="source-btn active" id="btn-source-apple">Apple Music</button>
      <button class="source-btn" id="btn-source-spotify">Spotify</button>
    </div>

    <!-- Playlist field -->
    <div class="field">
      <label for="playlist-input">Playlist</label>
      <div class="input-wrap">
        <input
          id="playlist-input"
          class="input"
          type="text"
          placeholder="Loading playlists…"
          autocomplete="off"
          disabled
        >
        <div id="playlist-dropdown" class="dropdown" hidden></div>
      </div>
    </div>

    <!-- Crate name field -->
    <div class="field">
      <label for="crate-input">Crate name</label>
      <input id="crate-input" class="input" type="text" placeholder="Name for the Serato crate">
    </div>

    <!-- Create button -->
    <button class="btn-primary" id="btn-create" disabled>Create Crate</button>

    <!-- Status -->
    <p class="status" id="status">Loading playlists…</p>

    <!-- Results (hidden until crate created) -->
    <div id="results" class="results" hidden>

      <!-- Stats -->
      <div class="stats">
        <div class="stat matched">
          <span class="stat-num" id="stat-matched">0</span>
          <span class="stat-lbl">matched</span>
        </div>
        <div class="stat fuzzy">
          <span class="stat-num" id="stat-fuzzy">0</span>
          <span class="stat-lbl">fuzzy</span>
        </div>
        <div class="stat missing">
          <span class="stat-num" id="stat-missing">0</span>
          <span class="stat-lbl">missing</span>
        </div>
      </div>

      <!-- Matched track list -->
      <div class="track-list" id="track-list"></div>

      <!-- Missing section -->
      <div id="missing-section" class="missing-section" hidden>
        <div class="missing-header">
          <span class="missing-label" id="missing-label"></span>
          <div class="toggle-btns" id="missing-toggles">
            <button class="text-btn" id="btn-select-all">All</button>
            <button class="text-btn" id="btn-select-none">None</button>
          </div>
        </div>
        <div class="missing-list" id="missing-list"></div>
        <p class="sldl-hint" id="sldl-hint" hidden>
          Install sldl to download missing tracks via Soulseek. It is not included in this app — see the README.
        </p>
        <div class="download-summary" id="download-summary" hidden></div>
        <div class="download-row">
          <button class="btn-download" id="btn-download" hidden></button>
          <button class="btn-cancel" id="btn-cancel" hidden>Cancel</button>
        </div>
        <div class="download-log" id="download-log" hidden></div>
      </div>

    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Settings</span>
        <button class="modal-close" id="modal-close">✕</button>
      </div>

      <div class="field">
        <label>Soulseek username</label>
        <input id="s-username" class="input" type="text" placeholder="username">
      </div>
      <div class="field">
        <label>Soulseek password</label>
        <input id="s-password" class="input" type="password" placeholder="••••••••">
      </div>
      <div class="test-conn-row">
        <button class="text-btn" id="btn-test-conn">Test connection</button>
        <span class="test-conn-status" id="test-conn-status"></span>
      </div>
      <div class="field">
        <label>Download folder</label>
        <div class="folder-row">
          <input id="s-folder" class="input" type="text" readonly>
          <button class="btn-browse" id="btn-browse">Browse…</button>
        </div>
      </div>

      <button class="btn-primary" id="btn-save-settings">Save</button>
      <p class="modal-status" id="modal-status"></p>

      <hr class="divider" hidden>

      <div class="spotify-auth-row" hidden>
        <button class="text-btn" id="btn-spotify-connect">Connect</button>
        <button class="text-btn" id="btn-spotify-disconnect">Disconnect</button>
        <span class="spotify-status" id="spotify-status"></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
